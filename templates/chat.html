
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chit-Chatty | AI Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #080b25, #171044, #30145c);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 90vh;
            background: rgba(15, 18, 52, 0.95);
            border: 1px solid rgba(173, 145, 255, 0.3);
            border-radius: 22px;
            box-shadow: 0 0 35px rgba(137, 80, 255, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        
        .header {
            padding: 17px;
            text-align: center;
            background: linear-gradient(90deg, #512da8, #7b2ff7, #3f51b5);
        }

        .robot-logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 8px;
            background: linear-gradient(135deg, #ffffff, #c5b5ff);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 39px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .header h2 {
            font-size: 27px;
            letter-spacing: 1px;
        }

        .header p {
            margin-top: 5px;
            font-size: 13px;
            color: #e0d7ff;
        }

       
        .settings {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 13px;
            background: #17183e;
            border-bottom: 1px solid #343260;
            flex-wrap: wrap;
        }

        .settings label {
            color: #d8caff;
            font-size: 14px;
        }

        .settings select {
            padding: 9px 14px;
            border-radius: 20px;
            border: 1px solid #8063d5;
            background: #25204e;
            color: white;
            outline: none;
            cursor: pointer;
            max-width: 100%;
        }

        .settings select option {
            background: #202044;
            color: white;
        }

        
        .chat-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 13px 17px;
            border-radius: 15px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #7138db, #4e5bd5);
            border-bottom-right-radius: 3px;
        }

        .assistant {
            align-self: flex-start;
            background: #25264f;
            border: 1px solid #51458c;
            border-bottom-left-radius: 3px;
        }

        .typing {
            color: #c5b5ff;
            font-style: italic;
            font-size: 13px;
        }

        
        .clear-btn {
            display: block;
            margin: 0 auto 12px;
            padding: 8px 18px;
            background: transparent;
            color: #c8baff;
            border: 1px solid #7662bd;
            border-radius: 20px;
            cursor: pointer;
        }

        .clear-btn:hover {
            background: #33265f;
        }

   
        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: #111331;
            border-top: 1px solid #343260;
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            padding: 14px 18px;
            border: 1px solid #51458c;
            border-radius: 30px;
            outline: none;
            background: #202044;
            color: white;
            font-size: 15px;
        }

        .input-area input::placeholder {
            color: #aaa5ca;
        }

        .input-area button {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #a855f7, #536dfe);
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #9364ff;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            text-align: center;
            padding: 9px;
            color: #aaa5ca;
            background: #111331;
            font-size: 11px;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 94vh;
            }

            .message {
                max-width: 90%;
            }

            .input-area {
                padding: 12px;
            }

            .input-area button {
                padding: 10px 17px;
            }

            .header h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">


    <div class="header">
        <div class="robot-logo">🤖</div>
        <h2>✨ Chit-Chatty</h2>
        <p>Your Friendly AI Buddy | Ask me anything!</p>
    </div>


    <div class="settings">
        <label for="model">⚙ Choose Gemini Model:</label>

        <select id="model">
            <option value="gemini-3.8-flash">
                Gemini 3.8 Flash 
            </option>

            <option value="gemini-3.6-flash">
                gemini-3.6 Flash
            </option>

            <option value="gemini-3.5-flash-lite">
                Gemini 3.5 Flash-Lite 
            </option>

            <option value="gemini-3.1-flash-lite">
                gemini-3.1 Flash-Lite
            </option>
        </select>
    </div>

  
    <div class="chat-box" id="chat-box">

        <div class="message assistant">
            Hello! 👋 Welcome to Chit-Chatty!💜
        </div>

    </div>

    <button class="clear-btn" onclick="clearChat()">
        🗑 Clear Chat
    </button>

 
    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Ask Chit-Chatty anything..."
            onkeydown="if(event.key === 'Enter') sendMessage()"
        >

        <button id="send-btn" onclick="sendMessage()">
            Send ➤
        </button>

    </div>

    <div class="footer">
        Chit-Chatty AI Assistant
    </div>

</div>

<script>

    let messageHistory = [];
    let isSending = false;

    function addMessage(text, sender) {

        const chatBox = document.getElementById("chat-box");

        const messageDiv = document.createElement("div");

        messageDiv.className = "message " + sender;

        messageDiv.textContent = text;

        chatBox.appendChild(messageDiv);

        chatBox.scrollTop = chatBox.scrollHeight;

        return messageDiv;
    }

    async function sendMessage() {

        if (isSending) return;

        const input = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        const message = input.value.trim();

        const selectedModel = document.getElementById("model").value;

        if (!message) return;

        addMessage(message, "user");

        input.value = "";

        isSending = true;
        sendBtn.disabled = true;
        sendBtn.textContent = "Thinking...";

        const payload = {
            message: message,
            history: messageHistory,
            model: selectedModel
        };

        messageHistory.push({
            role: "user",
            content: message
        });

        const typingMessage = addMessage(
            "Chit-Chatt is thinking... 🤖",
            "assistant"
        );

        try {

            const response = await fetch("/api/chat/", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(payload)

            });

            const data = await response.json();

            typingMessage.remove();

            if (response.ok && data.reply) {

                addMessage(data.reply, "assistant");

                messageHistory.push({
                    role: "assistant",
                    content: data.reply
                });

            } else {

                messageHistory.pop();

                addMessage(
                    data.error || "Something went wrong.",
                    "assistant"
                );

            }

        } catch (error) {

            typingMessage.remove();

            messageHistory.pop();

            addMessage(
                "Unable to connect to the server. Please try again.",
                "assistant"
            );

        } finally {

            isSending = false;
            sendBtn.disabled = false;
            sendBtn.textContent = "Send ➤";

            input.focus();

        }
    }

    function clearChat() {

        if (isSending) return;

        messageHistory = [];

        document.getElementById("chat-box").innerHTML = "";

        addMessage(
            "Hello again! 👋 Welcome back to Chit-Chatty! How can I help you? 💜",
            "assistant"
        );
    }

</script>

</body>
</html>
